name: dailyplan-test

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: dailyplan_test
      MYSQL_USER: dailyplan
      MYSQL_PASSWORD: dailyplan_test_password
      MYSQL_ROOT_PASSWORD: dailyplan_test_root_password
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    tmpfs:
      - /var/lib/mysql
